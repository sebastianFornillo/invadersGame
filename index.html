<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05010f">
    <title>Invaders Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="stage">
        <canvas id="game" aria-label="Invaders Space"></canvas>
    </main>

    <div class="hud-buttons">
        <button id="muteBtn" aria-label="Silenciar">♪</button>
        <button id="pauseBtn" aria-label="Pausa">II</button>
    </div>

    <div id="touch" class="touch" aria-hidden="true">
        <div class="tpad">
            <button data-k="left">◀</button>
            <button data-k="right">▶</button>
        </div>
        <button class="tfire" data-k="fire">FIRE</button>
    </div>

    <p class="rotate-hint">Girá el teléfono para jugar ↻</p>

    <script src="game.js"></script>
</body>
</html>
